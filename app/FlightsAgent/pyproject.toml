[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FlightsAgent"
version = "0.1.0"
description = "AgentCore A2A Agent using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] >= 0.3.0, < 0.4.0",
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[a2a,strands-agents] >= 1.18.1",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.30.0",
    "strands-agents >= 1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
