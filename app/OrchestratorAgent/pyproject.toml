[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "OrchestratorAgent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] >= 0.3.0, < 0.4.0",
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1",
    "boto3",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.28.1, < 2.0.0",
    "strands-agents[a2a] >= 1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
